name: MediBook AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Verify Backend, Web & AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Root & Workspace Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../web && npm ci
          cd ../mobile && npm ci

      - name: Install Python AI Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt

      - name: Execute Backend & AI Automated Verification Tests
        run: |
          npm test

      - name: Build Web Application
        run: |
          npm run build:web

      - name: Typecheck Mobile Application
        run: |
          cd mobile
          npx tsc --noEmit
